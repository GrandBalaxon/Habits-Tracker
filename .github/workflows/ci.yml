name: Django CI

on: [push, pull_request]

jobs:
  lint:
    name: Run linters
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}-lint

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root --with lint

      - name: Run Flake8
        run: poetry run flake8 .

  checks:
    name: Run system and migration checks
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings_ci
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}-dev

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root --with dev

      - name: Django System Check
        run: poetry run python manage.py check
        env:
          SECRET_KEY: 'dummy-secret-key-for-ci'
          DEBUG: "True"

      - name: Check for missing migrations
        run: poetry run python manage.py makemigrations --check --dry-run
        env:
          SECRET_KEY: 'dummy-secret-key-for-ci'
          DEBUG: "True"

  test:
    name: Run tests
    needs: [checks]
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings_ci
    steps:
      - name: Check out Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}-dev

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root --with dev

      - name: Run tests
        env:
          SECRET_KEY: 'dummy-secret-key-for-ci'
          DEBUG: "True"
          CORS_ALLOW_ALL_ORIGINS: "True"
        run: poetry run python manage.py test

  build:
    name: Build Docker image
    needs: [lint, test]
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build all images
        run: docker compose build

  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy to server
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          ssh -o StrictHostKeyChecking=no $SSH_USER@$SERVER_IP << EOF
            cd /home/$SSH_USER/Habits-Tracker
            git pull origin main
            docker compose down
            docker compose up -d --build
            docker compose exec web python manage.py migrate
          EOF
